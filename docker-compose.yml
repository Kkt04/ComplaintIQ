version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: complaintiq_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=complaintiq
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: complaintiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complaintiq_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=complaintiq
      - USE_MOCK_DB_IF_UNAVAILABLE=False
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"

volumes:
  mongodata:
  redisdata:
