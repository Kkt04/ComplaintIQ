name: ComplaintFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: complaint_user
          POSTGRES_PASSWORD: complaint_secret
          POSTGRES_DB: complaintflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://complaint_user:complaint_secret@localhost:5432/complaintflow
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          SECRET_KEY: ci_secret_key_testing_environment_only
        run: |
          pytest -v
